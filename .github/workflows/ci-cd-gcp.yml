name: CI/CD - Google Cloud Function

on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    name: Validate and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - name: Check for forbidden sensitive files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(pem|key|p12|pfx)$|credentials\.json$|service-account.*\.json$)'; then exit 1; fi
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      FUNCTION_NAME: ${{ vars.GCP_FUNCTION_NAME }}
      PUBSUB_TOPIC: ${{ vars.GCP_PUBSUB_TOPIC }}
      AI_OUTPUT_TOPIC: ${{ vars.GCP_AI_OUTPUT_TOPIC }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Validate deployment configuration
        run: |
          set -euo pipefail
          for required in PROJECT_ID REGION FUNCTION_NAME PUBSUB_TOPIC AI_OUTPUT_TOPIC; do test -n "${!required}"; done
      - name: Deploy Cloud Run function (Gen 2)
        run: >-
          gcloud functions deploy "${FUNCTION_NAME}" --gen2 --project="${PROJECT_ID}" --region="${REGION}" --runtime=nodejs20 --source=gcp/deploy --entry-point=handler --trigger-topic="${PUBSUB_TOPIC}" --set-env-vars="AI_PROVIDER=vertex,GCP_PROJECT_ID=${PROJECT_ID},GCP_REGION=${REGION},AI_OUTPUT_TOPIC=${AI_OUTPUT_TOPIC}" --retry --max-instances=1 --memory=256Mi --quiet
